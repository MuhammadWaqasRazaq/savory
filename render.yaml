services:
  - type: web
    name: savory
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci --include=dev && cd ../frontend && npm ci --include=dev && npm run build
    startCommand: NODE_ENV=production node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false